# Embeddings service image (docs/02 §4, 22 nov 2026): its own locked environment, apart from the backend, so the
# backend image carries no torch. CPU-only torch comes from the PyTorch index; everything else from PyPI.
[project]
name = "hermes-embeddings"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
]

[tool.uv]
package = false
# The image is linux/amd64 (python:3.12-slim): lock only that platform.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
