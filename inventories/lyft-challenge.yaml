# Test inventory for the M6 challenge (D-085, D-087): a FICTIONAL ride-hailing company modelled on the stack of the
# challenge brief (docs/Stack tecnologico.txt). No real company data: people, e-mails (example.test), IPs and names are
# made up. Readable summary for approval: docs/inventario-prueba.md (local).
#   make itop-load INVENTORY=inventories/lyft-challenge.yaml                 dry run
#   make itop-load INVENTORY=inventories/lyft-challenge.yaml APPLY=1 UPDATE=1   write (UPDATE: links the organization to
#                                                                            its delivery model, created by provision)
#   make itop-map-cpe INVENTORY=inventories/lyft-challenge.yaml              after the first scan synced the products
# The organization (Demo-Lab) and the person "Hermes System" come from docker/itop/provision.php.
# Where the brief gives only major.minor (Next.js 13.5, Go 1.21...) the inventory uses the .0 release.
# Three CIs are incomplete on purpose (pending screen): svc-reportes-legado, emr-nodo-02 and superset-bi.
# The iTop fields of F18.3 are all used: cpu/ram on servers, VMs and the PC; each installation with its real
# subclass (one PCSoftware), its status (one inactive), licence and description; Software.type = that subclass;
# SoftwareLicence with usage limit and dates (one about to expire, one expired), never a licence key.

env:
  ITOP_ORG_ID: "@Organization:Demo-Lab"
  ITOP_CALLER_ID: "@Person:Hermes System"
  ITOP_SERVICE_ID: "@Service:Gestión de vulnerabilidades"

# CPE vendor:product checked against the NVD CPE dictionary (23 nov 2026). null = no CPE on purpose.
cpe:
  # User decision (24 nov 2026): the kernel CPE on ONE node only, to show the real kernel risk without flooding iTop.
  # eks-nodo-01 runs the upstream kernel (product "Linux Kernel", mapped); the other nodes run Amazon's maintained
  # kernel package (product "Kernel de Amazon Linux 2023"), left without a CPE: NVD's upstream ranges do not describe
  # a vendor-patched kernel, so it stays in the pending screen.
  Linux Kernel: "cpe:2.3:o:linux:linux_kernel:*:*:*:*:*:*:*:*"
  Kernel de Amazon Linux 2023: null
  Kubernetes: "cpe:2.3:a:kubernetes:kubernetes:*:*:*:*:*:*:*:*"
  Envoy: "cpe:2.3:a:envoyproxy:envoy:*:*:*:*:*:*:*:*"
  Go: "cpe:2.3:a:golang:go:*:*:*:*:*:*:*:*"
  Gin: "cpe:2.3:a:gin-gonic:gin:*:*:*:*:*:*:*:*"
  Python: "cpe:2.3:a:python:python:*:*:*:*:*:*:*:*"
  FastAPI: "cpe:2.3:a:tiangolo:fastapi:*:*:*:*:*:*:*:*"
  Flask: "cpe:2.3:a:palletsprojects:flask:*:*:*:*:*:*:*:*"
  PostgreSQL: "cpe:2.3:a:postgresql:postgresql:*:*:*:*:*:*:*:*"
  PostGIS: "cpe:2.3:a:postgis:postgis:*:*:*:*:*:*:*:*"
  Redis: "cpe:2.3:a:redis:redis:*:*:*:*:*:*:*:*"
  MongoDB: "cpe:2.3:a:mongodb:mongodb:*:*:*:*:*:*:*:*"
  Apache Kafka: "cpe:2.3:a:apache:kafka:*:*:*:*:*:*:*:*"
  Apache Spark: "cpe:2.3:a:apache:spark:*:*:*:*:*:*:*:*"
  Apache Superset: "cpe:2.3:a:apache:superset:*:*:*:*:*:*:*:*"
  Next.js: "cpe:2.3:a:vercel:next.js:*:*:*:*:*:*:*:*"
  React: "cpe:2.3:a:facebook:react:*:*:*:*:*:*:*:*"
  React Native: "cpe:2.3:a:facebook:react-native:*:*:*:*:*:*:*:*"
  Vite: "cpe:2.3:a:vitejs:vite:*:*:*:*:*:*:*:*"

