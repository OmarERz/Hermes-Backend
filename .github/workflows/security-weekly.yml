name: Security weekly

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version-file: .python-version
      - name: pip-audit on the locked dependencies
        run: make audit

  gitleaks-history:
    name: gitleaks-full-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks over all history
        run: GITLEAKS_FULL_HISTORY=1 make secrets

  slow-tests:
    name: slow-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version-file: .python-version
      - name: Install dependencies
        run: uv sync --locked
      - name: Slow tests
        run: |
          rc=0
          uv run --locked pytest -m slow --no-cov || rc=$?
          # Exit code 5 means that no test carries the slow marker yet.
          if [ "$rc" -eq 5 ]; then
            echo "SKIPPED: no test carries the slow marker yet"
          else
            exit "$rc"
          fi

  kics:
    name: kics-compose
    # Trivy does not cover Compose files, so KICS (platform dockerCompose) checks compose.yaml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KICS scan of compose.yaml (fails on CRITICAL, HIGH and MEDIUM)
        # The same pinned image and flags as `make kics`, which `make verify` and the CI static job also run (F12.3);
        # kept here as the scheduled re-check of the default branch.
        run: make kics

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The embeddings image is about 2.8 GB and Trivy exports each image to /tmp before scanning it: on 23 Nov the job
      # failed with "no space left on device". Remove preinstalled toolchains this job never uses (about 25 GB).
      - name: Free disk space for the image scans
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Trivy config scan (Dockerfiles)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          # docker/itop/Dockerfile builds the iTop TEST instance only (compose.itop.yaml, never deployed): its base
          # image runs Apache and MariaDB as root, so it cannot have a non-root USER (DS-0002). Skipped by file
          # only, a decision of the user recorded in docs/02 §4 (F12.1); every other Dockerfile is still checked.
          skip-files: docker/itop/Dockerfile
      # Every scan runs even if an earlier one fails, so the job reports all findings (docs/14 §4).
      - name: Build the backend image
        if: ${{ !cancelled() }}
        run: docker build -t hermes-backend:scan .
      - name: Build the auth emulator image
        if: ${{ !cancelled() }}
        run: docker build -t hermes-auth-emulator:scan docker/auth-emulator
      - name: Build the database image (pinned pgvector without gosu, docker/db)
        if: ${{ !cancelled() }}
        run: docker build -t hermes-db:scan docker/db
      - name: Build the embeddings image (CPU-only sentence-transformers, docker/embeddings)
        if: ${{ !cancelled() }}
        run: docker build -t hermes-embeddings:scan docker/embeddings
      - name: Trivy image scan (backend)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-backend:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Fail only when a fix exists (user decision, docs/02 §4, F12.1). Unfixed OS findings of the Debian base
          # images are still printed in the job log and documented as accepted risk (docs/seguridad/asvs-resumen.md).
          ignore-unfixed: true
      - name: Trivy image scan (auth emulator)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-auth-emulator:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Fail only when a fix exists (user decision, docs/02 §4, F12.1). Unfixed OS findings of the Debian base
          # images are still printed in the job log and documented as accepted risk (docs/seguridad/asvs-resumen.md).
          ignore-unfixed: true
      - name: Trivy image scan (database)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-db:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy image scan (embeddings)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-embeddings:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # The steps above fail only on fixable findings; this one keeps the unfixed ones reported in the log
      # (accepted risk, docs/seguridad/asvs-resumen.md) and never fails the job.
      - name: Trivy report of unfixed findings (informational)
        if: ${{ !cancelled() }}
        run: |
          for image in hermes-backend:scan hermes-auth-emulator:scan hermes-db:scan hermes-embeddings:scan; do
            echo "::group::Unfixed HIGH/CRITICAL in $image"
            trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$image"
            echo "::endgroup::"
          done

  zap:
    name: zap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ZAP scans the API: the embeddings service runs as its fake (compose.ci.yaml); the trivy job scans the real one.
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ZAP always runs: its prerequisites (the stack and `make emulator-token`) exist since F0.7, so a missing one
      # is a failure, never a silent skip (F12.3).
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version-file: .python-version
      - name: Start the stack with throwaway passwords
        run: |
          for var in POSTGRES_PASSWORD MIGRATOR_DB_PASSWORD APP_DB_PASSWORD RETENTION_DB_PASSWORD CURSOR_SIGNING_KEY; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done
          # ZAP reads the schema from /api/openapi.json, which is served only with the docs enabled.
          echo "API_DOCS_ENABLED=true" >> "$GITHUB_ENV"
      - name: Wait for the stack
        # compose.yaml mounts credentials as Docker secret files (D-042): write them from the masked env first.
        run: make compose-secrets && docker compose up --build --wait -d
      - name: ZAP API scan
        run: |
          TEST_TOKEN=$(make --no-print-directory emulator-token ROLE=admin)
          echo "::add-mask::$TEST_TOKEN"
          API_URL=http://localhost:8000 TEST_TOKEN="$TEST_TOKEN" make zap
      - name: Stop the stack
        if: always()
        run: docker compose down -v
