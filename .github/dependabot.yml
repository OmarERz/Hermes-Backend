version: 2
updates:
  - package-ecosystem: "uv"
    # The backend and the embeddings service image (docker/embeddings has its own uv.lock, CPU-only torch).
    directories: ["/", "/docker/embeddings"]
    target-branch: "develop"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/", "/docker/auth-emulator", "/docker/db", "/docker/embeddings"]
    target-branch: "develop"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
    # Runtimes are pinned by decision (Python 3.12.16, Node 22 LTS for the emulator): only patch updates here;
    # a runtime upgrade is a planned change, not a weekly bump.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # PostgreSQL 18 is pinned by decision (docker/db): a major upgrade needs a dump and restore.
      - dependency-name: "pgvector/pgvector"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/docker/auth-emulator"
    target-branch: "develop"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
    groups:
      emulator-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "develop"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
    # PostgreSQL 18 is pinned by decision: a major upgrade needs a dump and restore.
    ignore:
      - dependency-name: "pgvector/pgvector"
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
