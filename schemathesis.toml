# Configuration and catalog writes validate semantics the schema cannot express (parameter keys of the formula and
# settings catalog, ISO country and language codes, formula rules of FRO-05, catalog sector codes, the source rules of D-041). A request that is
# schema-valid but breaks one of those rules is correctly refused with 422 `validation_error` (documented on every
# operation), so for these operations, and only for them, 422 counts as accepted for positive data.

[[operations]]
include-name = "POST /api/formula/simulate"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "422", "429", "5xx"]

[[operations]]
include-name = "PUT /api/config"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "422", "429", "5xx"]

[[operations]]
include-name = "PUT /api/profile"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "401", "403", "404", "409", "422", "429", "5xx"]

[[operations]]
