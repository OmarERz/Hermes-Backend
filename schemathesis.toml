# Schemathesis configuration (docs/14 §4.3). Read from the working directory by `make schemathesis`.
#
# Paginated operations take a signed cursor (HMAC, API-02). A cursor generated from the schema (a string that only
# matches the documented pattern) is correctly refused with 400 `invalid_cursor`, which the OpenAPI declares on
# those operations. So for them, and only for them, a documented 400 counts as accepted for positive data.
# Every other operation keeps the default expectations.

[[operations]]
include-name = "GET /api/alerts"
checks.positive_data_acceptance.expected-statuses = ["2xx", "3xx", "400", "401", "403", "404", "409", "429", "5xx"]

[[operations]]
include-name = "GET /api/audit"
