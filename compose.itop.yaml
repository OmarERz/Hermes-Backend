# iTop 3.2.2 test instance (F0.7, C13). Local tests only, never production.
#   make itop-up        start it (needs the ITOP_* variables, see docs/itop-test-instance.md)
#   make itop-install   unattended install + provisioning (idempotent)
#   make itop-seed      load the synthetic stack
#   make itop-down      stop and delete its data
# A separate file on purpose: required-variable checks (`:?`) are evaluated even for services of an inactive
# profile, so putting these in compose.yaml would break `docker compose up` for everyone without iTop.
name: hermes-itop

services:
  itop-db:
    profiles: [itop]
    image: mariadb:13.0@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    environment:
      MARIADB_ROOT_PASSWORD: ${ITOP_DB_ROOT_PASSWORD:?set ITOP_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: itop
      MARIADB_USER: itop
      MARIADB_PASSWORD: ${ITOP_DB_PASSWORD:?set ITOP_DB_PASSWORD}
    volumes:
      - itop_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  itop:
    profiles: [itop]
    # docker/itop/Dockerfile: the pinned vbkunin/itop:3.2.2-base (`latest` points to a 3.3 beta) plus mariadb-client.
    build: docker/itop
    image: hermes-itop:3.2.2
    platform: linux/amd64
    depends_on:
      itop-db:
        condition: service_healthy
    environment:
      ITOP_DB_PASSWORD: ${ITOP_DB_PASSWORD:?set ITOP_DB_PASSWORD}
      ITOP_ADMIN_PASSWORD: ${ITOP_ADMIN_PASSWORD:?set ITOP_ADMIN_PASSWORD}
      ITOP_PORT: ${ITOP_PORT:-8080}
      # Webhook target (ARQ-02): the backend on the host; the token is optional and sent as a Bearer header
      ITOP_WEBHOOK_URL: ${ITOP_WEBHOOK_URL:-http://host.docker.internal:8000/api/itop/webhook}
      ITOP_WEBHOOK_TOKEN: ${ITOP_WEBHOOK_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${ITOP_PORT:-8080}:80"
    volumes:
      - itop_conf:/var/www/html/conf
      - itop_data:/var/www/html/data
      - ./docker/itop/extensions/hermes-ci-attributes:/var/www/html/extensions/hermes-ci-attributes:ro
      - ./docker/itop:/opt/hermes-itop:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  itop_db:
  itop_conf:
  itop_data:
