# SonarQube Cloud (CI-based analysis). Replace both placeholders with the values shown by SonarQube Cloud
# when the organization is created and the repository imported (see the GitHub guide).
sonar.organization=REPLACE_WITH_SONAR_ORGANIZATION_KEY
sonar.projectKey=REPLACE_WITH_SONAR_PROJECT_KEY

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
