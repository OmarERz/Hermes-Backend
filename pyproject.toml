[project]
name = "hermes-backend"
version = "0.1.0"
description = "Self-hosted, personalized threat intelligence backend (iTop + CVE + news + LLM judge)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "feedparser>=6.0.14",
    "firebase-admin>=7.8.0",
    "httpx2>=2.16.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.57.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "stix2>=3.0.1",
    "stix2-validator>=3.2.0",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "import-linter>=2.17",
    "jsonschema>=4.26.0",
    "mypy",
    "openai>=3.57.0",
    "pytest",
    "pytest-cov>=7.1.0",
    "rfc3339-validator>=0.1.4",
    "types-jsonschema>=4.26.0.20261006",
    "pyyaml>=6.0.4",
    "ruff",
    "testcontainers>=4.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261113",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/core",
    "src/notifications_api",
    "src/notifications_slack",
    "src/workers",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PL",
    "S",    # flake8-bandit (docs/14 §3.1)
    "BLE", "T20", "DTZ", "TRY", "RUF",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Integration tests drive docker compose with a fixed argument list (no shell, no external input).
"tests/integration/**" = ["S101", "PLR2004", "S603"]
# The row builder of the constraint suite is one big dispatch over 75 tables (validated in capa 2).
"tests/integration/f00_database/constraints/dbsupport.py" = ["S101", "PLR2004", "PLR0911", "PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["api", "core", "notifications_api", "notifications_slack", "workers"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# firebase-admin, feedparser, stix2 and stix2-validator ship no type information (no stubs, no py.typed marker).
module = ["feedparser", "firebase_admin", "firebase_admin.*", "stix2", "stix2.*", "stix2validator", "stix2validator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not slow"]
markers = [
    "unit: pure functions, no I/O",
    "integration: module with its database and test doubles",
    "contract: schemas, OpenAPI and notification contract",
    "adversarial: E1-E22 judge suite with recorded responses",
    "e2e: whole stack in Docker Compose",
    "slow: excluded from PR runs (weekly)",
]

[tool.importlinter]
root_packages = ["api", "core", "notifications_api", "notifications_slack", "workers"]

[[tool.importlinter.contracts]]
name = "notifications_slack imports only notifications_api"
type = "forbidden"
source_modules = ["notifications_slack"]
forbidden_modules = ["core", "api", "workers"]

[[tool.importlinter.contracts]]
name = "notifications_api imports nothing internal"
type = "forbidden"
source_modules = ["notifications_api"]
forbidden_modules = ["api", "core", "workers", "notifications_slack"]

[[tool.importlinter.contracts]]
name = "core imports only notifications_api"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["api", "workers", "notifications_slack"]

[[tool.importlinter.contracts]]
name = "workers import only core and notifications_api"
type = "forbidden"
source_modules = ["workers"]
forbidden_modules = ["api", "notifications_slack"]

[[tool.importlinter.contracts]]
name = "api imports only core and notifications_api"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = ["workers", "notifications_slack"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.core_coverage]
# Core files need >= 95% line+branch coverage (COB-02). Globs on repository-relative paths; absent paths are skipped.
paths = [
    "src/core/scoring/*",
    "src/core/judge/*",
    "src/core/validation/*",
    "src/core/itop/outbox*",
    "src/core/notifications/*",
    "src/core/feedback/*",
    "src/api/auth/*",
]
