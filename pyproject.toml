[project]
name = "hermes-backend"
version = "0.1.0"
description = "Self-hosted, personalized threat intelligence backend (iTop + CVE + news + LLM judge)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy",
    "pytest",
    "ruff",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/core",
    "src/notifications_api",
    "src/notifications_slack",
    "src/workers",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "PL",
    "S",    # flake8-bandit (docs/14 §3.1)
    "BLE", "T20", "DTZ", "TRY", "RUF",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Integration tests drive docker compose with a fixed argument list (no shell, no external input).
"tests/integration/**" = ["S101", "PLR2004", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["api", "core", "notifications_api", "notifications_slack", "workers"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--strict-config", "-m", "not slow"]
markers = [
    "unit: pure functions, no I/O",
    "integration: module with its database and test doubles",
    "contract: schemas, OpenAPI and notification contract",
    "adversarial: E1-E22 judge suite with recorded responses",
    "e2e: whole stack in Docker Compose",
    "slow: excluded from PR runs (weekly)",
]
